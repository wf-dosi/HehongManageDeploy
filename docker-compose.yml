services:
  web:
    extends:
      file: ./HeHongManage/docker-compose.yml
      service: web
    build:
      context: ./HeHongManage
    volumes:
      - ./HeHongManage:/app/HeHongManage
    env_file:
      - ./.env

  worker:
    extends:
      file: ./HeHongManage/docker-compose.yml
      service: worker
    build:
      context: ./HeHongManage
    volumes:
      - ./HeHongManage:/app/HeHongManage
    env_file:
      - ./.env

  beat:
    extends:
      file: ./HeHongManage/docker-compose.yml
      service: beat
    build:
      context: ./HeHongManage
    volumes:
      - ./HeHongManage:/app/HeHongManage
    env_file:
      - ./.env

  flower:
    extends:
      file: ./HeHongManage/docker-compose.yml
      service: flower
    build:
      context: ./HeHongManage
    volumes:
      - ./HeHongManage:/app/HeHongManage
    env_file:
      - ./.env

  mcp-server:
    extends:
      file: ./HeHongManage/docker-compose.yml
      service: mcp-server
    build:
      context: ./HeHongManage
    volumes:
      - ./HeHongManage:/app/HeHongManage
    env_file:
      - ./.env

  mysql:
    image: ${MYSQL_IMAGE}
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在外层 .env 中配置 MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: ${REDIS_IMAGE}
    restart: always
    command: >
      redis-server
      --appendonly yes
    volumes:
      - ./data/redis:/data

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    restart: always
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./HeHongfrontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - flower
      - mcp-server
